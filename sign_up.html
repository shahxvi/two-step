<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2 Step Sneakers: Sign Up</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="images/logo.png">
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="sign_up.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="2 Step Sneakers" class="logo">
        </div>
    </header>

    <main>
        <div class="signup-box">
            
            <!-- Title -->
            <h1 class="signup-title"><strong>Sign Up</strong></h1>

            <!-- Sign Up Form -->
            <form action="sign_up.php" method="POST" class="signup-form">
                
                <!-- Username Field -->
                <div class="form-group">
                    <label class="form-label">Username :</label>
                    <input type="text" name="username" placeholder="Example: MarCelo" required class="form-input">
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label">Password :</label>
                    <input type="password" name="password" placeholder="Password must be at least 6 characters long." required class="form-input">
                </div>

                <!-- Sign Up Button -->
                <div class="button-container">
                    <button type="submit" class="submit-btn">Sign Up</button>
                </div>
            </form>

        </div>
    </main>
</body>
</html>
