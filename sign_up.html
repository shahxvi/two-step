<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2 Step Sneakers: Sign Up</title>
    <link rel="icon" type="image/jpg" href="images/logo.png">
    <link rel="stylesheet" href="sign_up.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="2 Step Sneakers" class="logo">
        </div>
    </header>

    <main>
        <div class="signup-box">
            <h1 class="signup-title"><strong>Sign Up</strong></h1>

            <form action="sign_up.php" method="POST" class="signup-form">
                <div class="form-group">
                    <label class="form-label">Username :</label>
                    <input type="text" name="username" placeholder="Example: MarCelo" required class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Password :</label>
                    <input type="password" name="password" minlength="6" placeholder="Password must be at least 6 characters long." required class="form-input">
                </div>

                <select name="role_id" required class="select-button">
                    <option value="">Select a role</option>
                    <option value="1">Customer</option>
                    <option value="2">Staff</option>
                    <option value="3">Admin</option>
                </select>

                <div class="button-container">
                    <button type="submit" class="submit-btn">Sign Up</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
