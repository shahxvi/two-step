<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Step Sneakers: Login/Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; padding: 0; font-family: sans-serif; background-color: 
    <!-- Top Navigation / Header Bar -->
        <!-- Logo Left -->
        <div style="background: white; padding: 5px 12px; border-radius: 4px; 
            <img src="images/two_step.png" alt="2 STEP" style="height: 35px; display: block;">
        </div>

        <!-- Search Bar & Cart Right -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="background: white; border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; width: 300px;">
                <input type="text" placeholder="" style="border: none; outline: none; width: 100%; background: transparent;">
            </div>
        </div>
    </header>

    <!-- Main Sign Up Box Container -->
    <main style="display: flex; justify-content: center; align-items: center; padding: 60px 20px;">
        <div style="background-color: width: 100%; max-width: 750px; padding: 50px 40px; border-radius: 12px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); text-align: center;">
            
            <!-- Title -->
            <h1 style= font-size: 36px; font-weight: normal; margin-top: 0; margin-bottom: 40px;">Sign Up</h1>

            <!-- Sign Up Form -->
            <form action="browse.html" method="GET" style="max-width: 500px; margin: 0 auto;">
                
                <!-- Username Field -->
                <div style="display: flex; align-items: center; margin-bottom: 25px;">
                    <label style="width: 130px; text-align: right; font-size: 18px; padding-right: 20px;">Username :</label>
                    <input type="text" name="username" required style="flex: 1; padding: 12px 15px; border: none; border-radius: 4px; background-color: #ded9cf; font-size: 16px; outline: none;">
                </div>

                <!-- Password Field -->
                <div style="display: flex; align-items: center; margin-bottom: 30px;">
                    <label style="width: 130px; text-align: right; font-size: 18px; padding-right: 20px;">Password :</label>
                    <input type="password" name="password" required style="flex: 1; padding: 12px 15px; border: none; border-radius: 4px; background-color: #ded9cf; font-size: 16px; outline: none;">
                </div>

                <!-- Sign Up Button (Aligned to the right like Canva) -->
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" style= border: none; padding: 10px 28px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0px 2px 4px rgba(0,0,0,0.1);">Sign Up</button>
                </div>

            </form>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
