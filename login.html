<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Step Sneakers: Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="images/two_step.png">

    <!-- Link your external CSS file here -->
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: white;">
    <h1>Login</h1>

    <form action="browse.html" method="GET">  
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="your username here" minlength="6" maxlength="10" required>

        <br>

        <label for="password">Password:</label>
        <input type="text" id="password" placeholder="your username here" minlength="6" maxlength="10" required>

        <br>

        <input type="submit" value="Login">

        <p>Not a member?</p>
        <a href="sign_up.html" style="background-color: #fefefe; color: black; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); text-decoration: none;">Sign Up</a>
    </form> 
     
    
    <script src="script.js"></script>
</body>
</html>
