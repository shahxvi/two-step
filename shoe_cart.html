<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Step Sneakers: Cart</title>
    <link rel="icon" type="image/jpg" href="images/logo.png"/>
    <link rel="stylesheet" href="shoe_cart.css">
</head>
<body>
    <div class="logo-container">
            <img src="images/logo.png" alt="2 Step Sneakers" class="logo">
    </div>
</body>

<main>
    <div class="cart-container">
        <h1 class="cart-title"><strong>Shopping Cart</strong></h1>
        <div class="cart-items">
            <!-- Cart items will be dynamically added here -->
        </div>
        <div class="cart-summary">
            <p>Total: RM<span id="total-price">0.00</span></p>
            <button type="submit" class="checkout-btn">Checkout</button>
        </div>
    </div>
